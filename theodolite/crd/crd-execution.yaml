apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: executions.theodolite.rocks
spec:
  group: theodolite.rocks
  names:
    kind: execution
    plural: executions
    shortNames:
      - exec
  versions:
  - name: v1beta2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        required: ["spec"]
        properties:
          spec:
            type: object
            required: ["benchmark", "load", "resources", "execution"]
            properties:
              name:
                description: This field exists only for technical reasons and should not be set by the user. The value of the field will be overwritten.
                type: string
                default: ""
              benchmark:
                description: The name of the benchmark this execution is referring to.
                type: string
              load: # definition of the load dimension
                description: Specifies the load values that are benchmarked.
                type: object
                required: ["loadType", "loadValues"]
                properties:
                  loadType:
                    description: The type of the load. It must match one of the load types specified in the referenced benchmark.
                    type: string
                  loadValues:
                    description: List of load values for the specified load type.
                    type: array
                    items:
                      type: integer
              resources: # definition of the resource dimension
                description: Specifies the scaling resource that is benchmarked.
                type: object
                required: ["resourceType", "resourceValues"]
                properties:
                  resourceType:
                    description: The type of the resource. It must match one of the resource types specified in the referenced benchmark.
                    type: string
                  resourceValues:
                    description:  List of resource values for the specified resource type.
                    type: array
                    items:
                      type: integer
              slis: # per-execution SLI overrides
                description: (Optional) Per-execution overrides for SLIs defined in the benchmark. Matched by name.
                type: array
                items:
                  type: object
                  required: ["name"]
                  properties:
                    name:
                      description: Name of the SLI to override. Must match an SLI in the referenced benchmark.
                      type: string
                    provider:
                      description: (Optional) Override for the metric provider.
                      type: string
                    query:
                      description: (Optional) Override for the PromQL query.
                      type: string
                    intervalSeconds:
                      description: (Optional) Override for the Prometheus step size in seconds.
                      type: integer
                    providerConfig:
                      description: (Optional) Override/extend provider-specific configuration (e.g., prometheusUrl, offsetHours).
                      type: object
                      additionalProperties: true
                      x-kubernetes-map-type: "granular"
                      default: { }
              slos: # per-execution SLO overrides
                description: (Optional) Per-execution overrides for SLOs defined in the benchmark. Matched by name.
                type: array
                items:
                  type: object
                  required: ["name"]
                  properties:
                    name:
                      description: Name of the SLO to override. Must match an SLO in the referenced benchmark.
                      type: string
                    sli:
                      description: (Optional) Override for the referenced SLI name.
                      type: string
                    warmupSeconds:
                      description: (Optional) Override for warmup duration in seconds.
                      type: integer
                    queryAggregation:
                      description: (Optional) Override for the query aggregation function.
                      type: string
                    repetitionAggregation:
                      description: (Optional) Override for the repetition aggregation function.
                      type: string
                    operator:
                      description: (Optional) Override for the comparison operator.
                      type: string
                    threshold:
                      description: (Optional) Override for the fixed threshold value.
                      type: number
                    thresholdRelToLoad:
                      description: (Optional) Override for threshold relative to load.
                      type: number
                    thresholdRelToResources:
                      description: (Optional) Override for threshold relative to resources.
                      type: number
                    thresholdFromExpression:
                      description: (Optional) Override for threshold from expression.
                      type: string
                    externalSloChecker:
                      description: (Optional) Override for the SLO checker URL.
                      type: string
              execution: # def execution config
                description: Defines the overall parameter for the execution.
                type: object
                required: ["strategy", "duration", "repetitions"]
                properties:
                  metric:
                    type: string
                  strategy:
                    description: Defines the used strategy for the execution, either 'LinearSearch', 'BinarySearch' or 'InitialGuessSearch'.
                    type: object
                    required: ["name"]
                    properties:
                      name:
                        type: string
                      restrictions:
                        description: List of restriction strategies used to delimit the search space.
                        type: array
                        items:
                          type: string
                      guessStrategy:
                        type: string
                      searchStrategy:
                        type: string
                  duration:
                    description: Defines the duration of each experiment in seconds.
                    type: integer
                  repetitions:
                    description: Number of repititions for each experiment.
                    type: integer
                  loadGenerationDelay:
                    description: Seconds to wait between the start of the SUT and the load generator.
                    type: integer
              configOverrides:
                description:  List of patchers that are used to override existing configurations.
                type: array
                items:
                  type: object
                  properties:
                    patcher:
                      description: Patcher used to patch a resource
                      type: object
                      required: ["type", "resource"]
                      properties:
                        type:
                          description: Type of the Patcher.
                          type: string
                          default: ""
                        resource:
                          description: Specifies the Kubernetes resource to be patched.
                          type: string
                          default: ""
                        properties:
                          description: (Optional) Patcher specific additional arguments.
                          type: object
                          additionalProperties: true
                          x-kubernetes-map-type: "granular"
                          default: {}
                    value:
                      type: string
                default: []
          status:
            type: object
            properties:
              executionState:
                description: ""
                type: string
              executionDuration:
                description: "Duration of the execution"
                type: string
              startTime:
                description: "Time this execution started"
                type: string
                format: date-time
              completionTime:
                description: "Time when this execution was stopped"
                type: string
                format: date-time
    additionalPrinterColumns:
    - name: Status
      type: string
      description: State of the execution
      jsonPath: .status.executionState
    - name: Duration
      type: string
      description: Duration of the execution
      jsonPath: .status.executionDuration
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    subresources:
      status: {}
  scope: Namespaced
