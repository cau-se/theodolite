                                      description: The matchLabels of the desired pod.
                                      additionalProperties: true
                                      x-kubernetes-map-type: "granular"
                                      default: { }
                                container:
                                  description: Specifies the container.
                                  default: ""
                                  type: string
                            command:
                              type: array
                              description: The command to be executed as string array.
                              items:
                                type: string
                            timeoutSeconds:
                              description: Specifies the timeout (in seconds) for the specified command.
                              type: integer
                        delete:
                          type: object
                          description: Specifies deletion of a resource.
                          required: [ selector ]
                          properties:
                            selector:
                              type: object
                              description: Defines how to select the resource to delete.
                              required: [ apiVersion, kind ]
                              properties:
                                apiVersion:
                                  type: string
                                  description: Specifies the api/version of the resource that should be deleted, e.g. 'kafka.strimzi.io/v1beta2'.
                                kind:
                                  type: string
                                  description: Specifies the Kind of the resource that should be deleted, e.g. 'KafkaTopic'.
                                nameRegex:
                                  type: string
                                  description: Specifies a regular expression that is matched with the metadata.name property of all resources with given api/version and Kind that should be deleted.
                                  default: "*"
                  afterActions:
                    type: array
                    default: [ ]
                    description: SUT after actions are executed after the teardown of the SUT.
                    items:
                      type: object
                      anyOf:
                        - required: [ exec ]
                        - required: [ delete ]
                      properties:
                        exec:
                          type: object
                          description: Specifies a command that gets executed within a Container of a Pod
                          required: [ selector, command, timeoutSeconds ]
                          properties:
                            selector:
                              type: object
                              description: The selector specifies which resource should be selected for the execution of the command.
                              properties:
                                pod:
                                  type: object
                                  description: Specifies the pod.
                                  properties:
                                    matchLabels:
                                      type: object
                                      description: The matchLabels of the desired pod.
                                      additionalProperties: true
                                      x-kubernetes-map-type: "granular"
                                      default: { }
                                container:
                                  description: Specifies the container.
                                  default: ""
                                  type: string
                            command:
                              type: array
                              description: The command to be executed as string array.
                              items:
                                type: string
                            timeoutSeconds:
                              description: Specifies the timeout (in seconds) for the specified command.
                              type: integer
                        delete:
                          type: object
                          description: Specifies deletion of a resource.
                          required: [ selector ]
                          properties:
                            selector:
                              type: object
                              description: Defines how to select the resource to delete.
                              required: [ apiVersion, kind ]
                              properties:
                                apiVersion:
                                  type: string
                                  description: Specifies the api/version of the resource that should be deleted, e.g. 'kafka.strimzi.io/v1beta2'.
                                kind:
                                  type: string
                                  description: Specifies the Kind of the resource that should be deleted, e.g. 'KafkaTopic'.
                                nameRegex:
                                  type: string
                                  description: Specifies a regular expression that is matched with the metadata.name property of all resources with given api/version and Kind that should be deleted.
                                  default: "*"
              loadGenerator:
                description: The loadGenResourceSets specifies all Kubernetes resources required to start the load generator. A resourceSet can be either a configMap resourceSet or a fileSystem resourceSet.
                type: object
                properties:
                  resources:
                    type: array
                    default: []
                    items:
                      type: object
                      oneOf:
                        - required: [ configMap ]
                        - required: [ fileSystem ]
                      properties:
                        configMap:
                          description: The configMap resourceSet loads the Kubernetes manifests from an Kubernetes configMap.
                          type: object
                          properties:
                            name:
                              description: The name of the configMap
                              type: string
                            files:
                              description: (Optional) Specifies which files from the configMap should be loaded. If this field is not set, all files are loaded.
                              type: array
                              items:
                                type: string
                        fileSystem:
                          description: The fileSystem resourceSet loads the Kubernetes manifests from the filesystem.
                          type: object
                          properties:
                            path:
                              description: The path to the folder which contains the Kubernetes manifests files.
                              type: string
                            files:
                              description: (Optional) Specifies which files from the configMap should be loaded. If this field is not set, all files are loaded.
                              type: array
                              items:
                                type: string
                  beforeActions:
                    type: array
                    default: [ ]
                    description: Load generator before actions are executed before the load generator is started.
                    items:
                      type: object
                      anyOf:
                        - required: [ exec ]
                        - required: [ delete ]
                      properties:
                        exec:
                          type: object
                          description: Specifies a command that gets executed within a Container of a Pod
                          required: [ selector, command, timeoutSeconds ]
                          properties:
                            selector:
                              type: object
                              description: The selector specifies which resource should be selected for the execution of the command.
                              properties:
                                pod:
                                  type: object
                                  description: Specifies the pod.
                                  properties:
                                    matchLabels:
                                      type: object
                                      description: The matchLabels of the desired pod.
                                      additionalProperties: true
                                      x-kubernetes-map-type: "granular"
                                      default: { }
                                container:
                                  description: Specifies the container.
                                  default: ""
                                  type: string
                            command:
                              type: array
                              description: The command to be executed as string array.
                              items:
                                type: string
                            timeoutSeconds:
                              description: Specifies the timeout (in seconds) for the specified command.
                              type: integer
                        delete:
                          type: object
                          description: Specifies deletion of a resource.
                          required: [ selector ]
                          properties:
                            selector:
                              type: object
                              description: Defines how to select the resource to delete.
                              required: [ apiVersion, kind ]
                              properties:
                                apiVersion:
                                  type: string
                                  description: Specifies the api/version of the resource that should be deleted, e.g. 'kafka.strimzi.io/v1beta2'.
                                kind:
                                  type: string
                                  description: Specifies the Kind of the resource that should be deleted, e.g. 'KafkaTopic'.
                                nameRegex:
                                  type: string
                                  description: Specifies a regular expression that is matched with the metadata.name property of all resources with given api/version and Kind that should be deleted.
                                  default: "*"
                  afterActions:
                    type: array
                    default: [ ]
                    description: Load generator after actions are executed after the teardown of the load generator.
                    items:
                      type: object
                      anyOf:
                        - required: [ exec ]
                        - required: [ delete ]
                      properties:
                        exec:
                          type: object
                          description: Specifies a command that gets executed within a Container of a Pod
                          required: [ selector, command, timeoutSeconds ]
                          properties:
                            selector:
                              type: object
                              description: The selector specifies which resource should be selected for the execution of the command.
                              properties:
                                pod:
                                  type: object
                                  description: Specifies the pod.
                                  properties:
                                    matchLabels:
                                      type: object
                                      description: The matchLabels of the desired pod.
                                      additionalProperties: true
                                      x-kubernetes-map-type: "granular"
                                      default: { }
                                container:
                                  description: Specifies the container.
                                  default: ""
                                  type: string
                            command:
                              type: array
                              description: The command to be executed as string array.
                              items:
                                type: string
                            timeoutSeconds:
                              description: Specifies the timeout (in seconds) for the specified command.
                              type: integer
                        delete:
                          type: object
                          description: Specifies deletion of a resource.
                          required: [ selector ]
                          properties:
                            selector:
                              type: object
                              description: Defines how to select the resource to delete.
                              required: [ apiVersion, kind ]
                              properties:
                                apiVersion:
                                  type: string
                                  description: Specifies the api/version of the resource that should be deleted, e.g. 'kafka.strimzi.io/v1beta2'.
                                kind:
                                    type: string
                                    description: Specifies the Kind of the resource that should be deleted, e.g. 'KafkaTopic'.
                                nameRegex:
                                  type: string
                                  description: Specifies a regular expression that is matched with the metadata.name property of all resources with given api/version and Kind that should be deleted.
                                  default: "*"
              resourceTypes:
                description: A list of resource types that can be scaled for this `benchmark` resource. For each resource type the concrete values are defined in the `execution` object.
                type: array
                minItems: 1
                items:
                  type: object
                  required: ["typeName", "patchers"]
                  properties:
                    typeName:
                      description: Name of the resource type.
                      type: string
                    patchers:
                      description: List of patchers used to scale this resource type.
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: ["type", "resource"]
                        properties:
                          type:
                            description: Type of the patcher.
                            type: string
                            default: ""
                          resource:
                            description: Specifies the Kubernetes resource to be patched.
                            type: string
                            default: ""
                          properties:
                            description: (Optional) Patcher specific additional arguments.
                            type: object
                            additionalProperties: true
                            x-kubernetes-map-type: "granular"
                            default: {}
              loadTypes:
                description: A list of load types that can be scaled for this benchmark. For each load type the concrete values are defined in the execution object.
                type: array
                minItems: 1
                items:
                  type: object
                  required: ["typeName","patchers"]
                  properties:
                    typeName:
                      description: Name of the load type.
                      type: string
                    patchers:
                      description: List of patchers used to scale this resource type.
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: ["type", "resource"]
                        properties:
                          type:
                            description: Type of the Patcher.
                            type: string
                            default: ""
                          resource:
                            description: Specifies the Kubernetes resource to be patched.
                            type: string
                            default: ""
                          properties:
                            description: (Optional) Patcher specific additional arguments.
                            type: object
                            additionalProperties: true
                            x-kubernetes-map-type: "granular"
                            default: {}
              slis: # def of service level indicators
                description: List of Service Level Indicators (SLIs). All SLI results are exported to CSV.
                type: array
                items:
                  type: object
                  required: ["name", "provider", "query"]
                  properties:
                    name:
                      description: Unique name for this SLI. Referenced by SLOs.
                      type: string
                    provider:
                      description: Metric provider. Supported values are 'prometheus' and 'dynatrace'.
                      type: string
                    query:
                      description: The query string for this SLI (PromQL for Prometheus, DQL for Dynatrace).
                      type: string
                    intervalSeconds:
                      description: (Optional) Query step size in seconds. Defaults to 5.
                      type: integer
                    providerConfig:
                      description: "(Optional) Provider-specific configuration (e.g., offsetHours, prometheusUrl, dynatraceUrl)."
                      type: object
                      additionalProperties: true
                      x-kubernetes-map-type: "granular"
                      default: { }
              slos: # def of service level objectives
                description: List of Service Level Objectives (SLOs). Only SLOs drive pass/fail decisions.
                type: array
                items:
                  type: object
                  required: ["name", "sli"]
                  properties:
                    name:
                      description: Unique name for this SLO.
                      type: string
                    sli:
                      description: Name of the SLI this SLO is based on. Must match an entry in slis.
                      type: string
                    warmupSeconds:
                      description: Seconds at the start of each interval to skip before evaluation. Defaults to 0.
                      type: integer
                      default: 0
                    queryAggregation:
                      description: (Optional) Aggregation function applied across the time series values (e.g., mean, max, median).
                      type: string
                    repetitionAggregation:
                      description: (Optional) Aggregation function applied across repetitions (e.g., mean, max, median).
                      type: string
                    operator:
                      description: (Optional) Comparison operator for the threshold check (e.g., lte, lt, gte, gt).
                      type: string
                    threshold:
                      description: (Optional) Fixed threshold value. Exactly one of threshold, thresholdRelToLoad, thresholdRelToResources, or thresholdFromExpression must be set.
                      type: number
                    thresholdRelToLoad:
                      description: (Optional) Threshold computed as this factor times the current load value.
                      type: number
                    thresholdRelToResources:
                      description: (Optional) Threshold computed as this factor times the current resource value.
                      type: number
                    thresholdFromExpression:
                      description: (Optional) Threshold computed from an expression using variables L (load) and R (resources).
                      type: string
                    externalSloChecker:
                      description: "(Optional) URL of the SLO checker service. Defaults to the generic SLO checker sidecar (THEODOLITE_SLO_CHECKER_URL, default: http://localhost:8082)."
                      type: string
          status:
            type: object
            properties:
              resourceSetsState:
                description: The status of a Benchmark indicates whether all resources are available to start the benchmark or not.
                type: string
    additionalPrinterColumns:
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    - name: Status
      type: string
      description: The status of a Benchmark indicates whether all resources are available to start the benchmark or not.
      jsonPath: .status.resourceSetsState
    subresources:
      status: {}
  scope: Namespaced