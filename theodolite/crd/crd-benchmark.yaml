apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: benchmarks.theodolite.rocks
spec:
  group: theodolite.rocks
  names:
    kind: benchmark
    plural: benchmarks
    shortNames:
