apiVersion: v1
kind: ConfigMap
metadata:
  name: example-configmap
data:
  envoy-configmap.yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: envoy-config
      labels:
        app: http-server
    data:
      envoy.yaml: |
        static_resources:
          listeners:
          - name: listener_0
            address:
              socket_address: { address: 0.0.0.0, port_value: 8080 }
            filter_chains:
            - filters:
              - name: envoy.filters.network.http_connection_manager
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                  stat_prefix: ingress_http
                  codec_type: AUTO
                  route_config:
                    name: local_route
                    virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                      - match:
                          path: "/"
                        route:
                          cluster: httpbin
                          prefix_rewrite: "/delay/1"
                          timeout: 2s
                  http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          clusters:
          - name: httpbin
            connect_timeout: 0.25s
            type: LOGICAL_DNS
            lb_policy: ROUND_ROBIN
            circuit_breakers:
              thresholds:
              - max_connections: 100
                max_pending_requests: 1000
            load_assignment:
              cluster_name: httpbin
              endpoints:
              - lb_endpoints:
                - endpoint:
                    address:
                      socket_address: { address: 127.0.0.1, port_value: 80 }
        admin:
          address:
            socket_address: { address: 0.0.0.0, port_value: 9901 }

  http-server-deployment.yaml: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: http-server
      labels:
        app: http-server
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: http-server
      template:
        metadata:
          labels:
            app: http-server
        spec:
          containers:
          - name: httpbin
            image: kennethreitz/httpbin
            ports:
            - containerPort: 80
            resources:
              limits:
                memory: "128Mi"
                cpu: "100m"
              requests:
                memory: "64Mi"
                cpu: "50m"
          - name: envoy
            image: envoyproxy/envoy:v1.27.0
            ports:
            - containerPort: 8080  # proxy
            - containerPort: 9901  # admin / metrics
            args:
            - "--config-path"
            - "/etc/envoy/envoy.yaml"
            resources:
              limits:
                memory: "512Mi"
                cpu: "500m"
              requests:
                memory: "128Mi"
                cpu: "100m"
            volumeMounts:
            - name: envoy-config
              mountPath: /etc/envoy
          volumes:
          - name: envoy-config
            configMap:
              name: envoy-config

  http-server-service-monitor.yaml: |-
    apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: http-server-service-monitor
      labels:
        app: http-server
    spec:
      selector:
        matchLabels:
          app: http-server
      endpoints:
      - port: admin
        interval: 10s
        path: /stats/prometheus

  http-server-service.yaml: |-
    apiVersion: v1
    kind: Service
    metadata:
      name: http-server
      labels:
        app: http-server
    spec:
      ports:
      - port: 80
        targetPort: 8080
        name: public
      - port: 9901
        targetPort: 9901
        name: admin
      selector:
        app: http-server

  load-generator-deployment.yaml: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: load-generator
      labels:
        app: load-generator
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: load-generator
      template:
        metadata:
          labels:
            app: load-generator
        spec:
          containers:
          - name: load-generator
            image: curlimages/curl:7.81.0
            env:
            - name: CALLS_PER_SECOND
              value: "10"
            command:
            - "sh"
            - "-c"
            - "SLEEP=$(echo \"scale=4; 1/$CALLS_PER_SECOND\" | bc); while true; do curl -s -o /dev/null -w '%{method} %{url}: %{http_code} %{time_total}\n' http://http-server:80 & sleep $SLEEP; done"
            resources:
              limits:
                memory: "128Mi"
                cpu: "250m"
              requests:
                memory: "64Mi"
                cpu: "50m"
