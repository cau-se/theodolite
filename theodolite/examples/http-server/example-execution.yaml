apiVersion: theodolite.rocks/v1beta2
kind: execution
metadata:
  name: example-execution
spec:
  benchmark: "example-benchmark"
  load:
    loadType: "CallsPerSecond"
    loadValues: [10, 20, 30, 50, 75, 100]
  resources:
    resourceType: "Instances"
    resourceValues: [1, 2, 3, 4, 5]
  slos:
    - name: "low-error-rate"
      warmupSeconds: 60
  execution:
    strategy:
      name: "RestrictionSearch"
      restrictions:
        - "LowerBound"
      searchStrategy: "LinearSearch"
    duration: 180
    repetitions: 1
    loadGenerationDelay: 10
  configOverrides: []
