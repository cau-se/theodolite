# The JOSDK operator must not auto-start in tests: Theodolite manages its own
# operator lifecycle and QuarkusTests have no cluster for the JOSDK informers.
%test.quarkus.operator-sdk.start-operator=false

# Skip startup CRD validation: CRDs are installed via Helm and the namespace-scoped operator may not GET cluster-scoped customresourcedefinitions.
quarkus.operator-sdk.crd.validate=false

# Activate leader election (configured via the LeaderElectionConfiguration bean in
# LeaderElectionProducer) for the runtime profiles. Left inactive for the 'test' profile, where the
# operator does not auto-start. Providing leader election as a bean rather than a
# ConfigurationServiceCustomizer avoids the OverriddenConfigurationService that would otherwise drop
# the Kubernetes client's KotlinLateinitModule (see LeaderElectionProducer).
quarkus.operator-sdk.activate-leader-election-for-profiles=prod,dev

quarkus.native.additional-build-args=\
  --initialize-at-run-time=io.fabric8.kubernetes.client.internal.CertUtils,\
  --initialize-at-run-time=io.fabric8.kubernetes.client.dsl.internal.uploadable.PodUpload,\
  --initialize-at-run-time=io.fabric8.kubernetes.client.dsl.internal.core.v1.PodOperationsImpl$1,\
  --initialize-at-run-time=io.fabric8.kubernetes.client.dsl.internal.core.v1.PodOperationsImpl$3,\
  --report-unsupported-elements-at-runtime
