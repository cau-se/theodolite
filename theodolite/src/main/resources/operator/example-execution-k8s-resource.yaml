apiVersion: theodolite.rocks/v1beta2
kind: execution
metadata:
  name: theodolite-example-execution
spec:  
  benchmark: uc1-kstreams
  load:  
    loadType: "NumSensors"
    loadValues:
      - 50000 
  resources:
    resourceType: "Instances"
    resourceValues:
      - 1
  slos:
    - name: "lag trend"
      threshold: 1000
      externalSloChecker: "http://localhost:80/evaluate-slope"
      warmupSeconds: 0
  execution:
    strategy: "LinearSearch"
    duration: 60
    repetitions: 1
    loadGenerationDelay: 30 # in seconds
    restrictions:
      - "LowerBound"
  configOverrides: []