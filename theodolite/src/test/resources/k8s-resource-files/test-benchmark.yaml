apiVersion: theodolite.rocks/v1beta2
kind: benchmark
metadata:
  name: example-benchmark
spec:
  waitForResourcesEnabled: false
  sut:
    resources:
      - configMap:
          name: "example-configmap"
          files:
            - "uc1-kstreams-deployment.yaml"
  loadGenerator:
    resources:
      - configMap:
          name: "example-configmap"
          files:
            - uc1-load-generator-service.yaml
            - uc1-load-generator-deployment.yaml
  resourceTypes:
    - typeName: "Instances"
      patchers:
        - type: "ReplicaPatcher"
          resource: "uc1-kstreams-deployment.yaml"
  loadTypes:
    - typeName: "NumSensors"
      patchers:
        - type: "EnvVarPatcher"
          resource: "uc1-load-generator-deployment.yaml"
          properties:
            variableName: "NUM_SENSORS"
            container: "workload-generator"
        - type: "NumSensorsLoadGeneratorReplicaPatcher"
          resource: "uc1-load-generator-deployment.yaml"
          properties:
            loadGenMaxRecords: "15000"
  slis:
    - name: consumerLag
      provider: prometheus
      query: "sum by(consumergroup) (kafka_consumergroup_lag >= 0)"
  slos:
    - name: "lag trend"
      sli: consumerLag
      warmupSeconds: 60
      externalSloChecker: "http://localhost:80/evaluate-slope"
      threshold: 3000
  kafkaConfig:
    bootstrapServer: "theodolite-kafka-kafka-bootstrap:9092"
    topics:
      - name: "input"
        numPartitions: 40
        replicationFactor: 1
      - name: "theodolite-.*"
        removeOnly: True
