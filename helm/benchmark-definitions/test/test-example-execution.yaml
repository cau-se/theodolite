apiVersion: theodolite.rocks/v1beta2
kind: execution
metadata:
  name: theodolite-test-execution
spec:
  benchmark: "example-benchmark"
  load:
    loadType: "CallsPerSecond"
    loadValues: [10]
  resources:
    resourceType: "Instances"
    resourceValues: [1]
  slos:
    - name: "low-error-rate"
      warmupSeconds: 0
  execution:
    strategy:
      name: "RestrictionSearch"
      restrictions:
        - "LowerBound"
      searchStrategy: "LinearSearch"
    duration: 120
    repetitions: 1
    loadGenerationDelay: 0
  configOverrides: []
