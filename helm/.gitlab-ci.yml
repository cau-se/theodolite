# Theodolite Helm Chart

lint-helm:
  stage: check
  needs: []
  image:
    name: alpine/helm:3.5.2
    entrypoint: [""]
  script: helm lint helm/
  rules:
  - changes:
    - helm/**/*
  - when: manual
    allow_failure: true

test-helm:
  stage: smoketest
  extends: .dind
  needs:
    - job: lint-helm
      optional: true
    - job: package-theodolite
      optional: true
  rules:
    # Keep in sync with lint-helm
    - changes:
      - helm/**/*
    # Keep in sync with package-theodolite
    - changes:
      - theodolite/**/*
      if: "$CR_STAGE_HOST && $CR_STAGE_PROJECT && $CR_STAGE_USER && $CR_STAGE_PW && $CR_STAGE_CERT"
    - when: manual
      allow_failure: true
  image: ghcr.io/cau-se/theodolite-build-k3d-helm:20.10.12
  variables:
    CLUSTERNAME: "$CI_PROJECT_NAME-$CI_PIPELINE_ID"
  cache:
    paths:
      - helm/charts
  before_script:
    - k3d help
    - k3d version
    - k3d cluster create $CLUSTERNAME --agents 1 --wait -p "30000:30000@agent:0"
    # show cluster info
    - kubectl cluster-info
    - helm version
  script:
    - cd helm
    - helm dependencies update .
    - >
      helm install theodolite . -f preconfigs/minimal.yaml
      ${CR_STAGE_HOST:+--set operator.image="$CR_STAGE_HOST/$CR_STAGE_PROJECT/theodolite" --set operator.imageTag="ci-$CI_PIPELINE_ID"}
      --wait --timeout 10m0s
    - kubectl get nodes -o wide
    - kubectl get pods --all-namespaces -o wide
    - kubectl get services --all-namespaces -o wide
    - helm test theodolite
  after_script:
    - k3d cluster delete $CLUSTERNAME
