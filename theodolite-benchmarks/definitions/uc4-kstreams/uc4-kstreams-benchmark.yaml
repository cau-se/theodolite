apiVersion: theodolite.rocks/v1beta2
kind: benchmark
metadata:
  name: uc4-kstreams
  labels:
    suite: theodolite-stream-processing
    benchmark: uc4
    sut: kstreams
spec:
  sut:
    resources:
      - configMap:
          name: "benchmark-resources-uc4-kstreams"
          files:
            - "input-topic.yaml"
            - "output-topic.yaml"
            - "aggregation-feedback-topic.yaml"
            - "configuration-topic.yaml"
            - "uc4-kstreams-deployment.yaml"
            - "uc4-kstreams-service.yaml"
            - "uc4-jmx-configmap.yaml"
            - "uc4-service-monitor.yaml"
    afterActions:
      - delete:
          selector:
            apiVersion: kafka.strimzi.io/v1beta2
            kind: KafkaTopic
            nameRegex: "^theodolite-.*"
  loadGenerator:
    resources:
      - configMap:
          name: "benchmark-resources-uc4-load-generator"
          files:
            - "uc4-load-generator-deployment.yaml"
            - "uc4-load-generator-service.yaml"
  resourceTypes:
    - typeName: "Instances"
      patchers:
        - type: "ReplicaPatcher"
          resource: "uc4-kstreams-deployment.yaml"
    - typeName: ThreadsAndPodResources
      patchers:
        - type: EnvVarPatcher
          resource: uc4-kstreams-deployment.yaml
          properties:
            container: uc-application
            variableName: NUM_STREAM_THREADS
        - type: ResourceLimitPatcher
          resource: uc4-kstreams-deployment.yaml
          properties:
            container: uc-application
            limitedResource: cpu
            factor: 1000
            format: m
        - type: ResourceLimitPatcher
          resource: uc4-kstreams-deployment.yaml
          properties:
            container: uc-application
            limitedResource: memory
            factor: 4
            format: Gi
  loadTypes:
    - typeName: "NumNestedGroups"
      patchers:
        - type: "EnvVarPatcher"
          resource: "uc4-load-generator-deployment.yaml"
          properties:
            container: "workload-generator"
            variableName: "NUM_NESTED_GROUPS"
        - type: NumNestedGroupsLoadGeneratorReplicaPatcher
          resource: "uc4-load-generator-deployment.yaml"
          properties:
            loadGenMaxRecords: "150000"
            numSensors: "4"
  slis:
    - name: consumerLag
      provider: prometheus
      query: "sum by(consumergroup) (kafka_consumergroup_lag{consumergroup='theodolite-uc4-application-0.0.1'} >= 0)"
    - name: droppedRecords
      provider: prometheus
      query: "sum(rate(kafka_streams_stream_task_metrics_dropped_records_total[30s])) by (job)"
  slos:
    - name: "lag trend"
      sli: consumerLag
      warmupSeconds: 60
      externalSloChecker: "http://localhost:80/evaluate-slope"
      threshold: 2000
    - name: droppedRecords
      sli: droppedRecords
      warmupSeconds: 60
      queryAggregation: max
      repetitionAggregation: median
      operator: lte
      threshold: 100
      externalSloChecker: "http://localhost:8082"
