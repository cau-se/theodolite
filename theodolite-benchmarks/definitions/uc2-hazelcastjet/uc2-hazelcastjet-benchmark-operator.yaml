apiVersion: theodolite.rocks/v1beta2
kind: benchmark
metadata:
  name: uc2-hazelcastjet
  labels:
    suite: theodolite-stream-processing
    benchmark: uc2
    sut: hazelcastjet
spec:
  sut:
    resources:
      - configMap:
          name: "benchmark-resources-uc2-hazelcastjet"
          files:
            - "input-topic.yaml"
            - "output-topic.yaml"
            - "uc2-hazelcastjet-deployment.yaml"
            - "uc2-hazelcastjet-service.yaml"
            - "uc2-jmx-configmap.yaml"
            - "uc2-service-monitor.yaml"
  loadGenerator:
    resources:
      - configMap:
          name: "benchmark-resources-uc2-load-generator"
          files:
            - "uc2-load-generator-deployment.yaml"
            - "uc2-load-generator-service.yaml"
  resourceTypes:
    - typeName: "Instances"
      patchers:
        - type: "ReplicaPatcher"
          resource: "uc2-hazelcastjet-deployment.yaml"
    - typeName: PodResources
      patchers:
        - type: ResourceLimitPatcher
          resource: uc2-hazelcastjet-deployment.yaml
          properties:
            container: uc-application
            limitedResource: cpu
            factor: 1000
            format: m
        - type: ResourceLimitPatcher
          resource: uc2-hazelcastjet-deployment.yaml
          properties:
            container: uc-application
            limitedResource: memory
            factor: 4
            format: Gi
  loadTypes:
    - typeName: "NumSensors"
      patchers:
        - type: "EnvVarPatcher"
          resource: "uc2-load-generator-deployment.yaml"
          properties:
            container: "workload-generator"
            variableName: "NUM_SENSORS"
        - type: NumSensorsLoadGeneratorReplicaPatcher
          resource: "uc2-load-generator-deployment.yaml"
          properties:
            loadGenMaxRecords: "150000"
  slis:
    - name: consumerLag
      provider: prometheus
      query: "sum by(consumergroup) (kafka_consumergroup_lag{consumergroup='theodolite-uc2-application'} >= 0)"
    - name: droppedRecords
      provider: prometheus
      query: "sum(rate(com_hazelcast_jet_metrics_lateeventsdropped[30s])) by(job)"
  slos:
    - name: "lag trend"
      sli: consumerLag
      warmupSeconds: 60
      externalSloChecker: "http://localhost:80/evaluate-slope"
      threshold: 2000
    - name: droppedRecords
      sli: droppedRecords
      warmupSeconds: 60
      queryAggregation: max
      repetitionAggregation: median
      operator: lte
      threshold: 100
      externalSloChecker: "http://localhost:8082"
