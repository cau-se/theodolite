apiVersion: theodolite.rocks/v1beta2
kind: benchmark
metadata:
  name: uc4-hazelcastjet
  labels:
    suite: theodolite-stream-processing
    benchmark: uc4
    sut: hazelcastjet
spec:
  sut:
    resources:
      - configMap:
          name: "benchmark-resources-uc4-hazelcastjet"
          files:
            - "input-topic.yaml"
            - "output-topic.yaml"
            - "aggregation-feedback-topic.yaml"
            - "configuration-topic.yaml"
            - "uc4-hazelcastjet-deployment.yaml"
            - "uc4-hazelcastjet-service.yaml"
            - "uc4-jmx-configmap.yaml"
            - "uc4-service-monitor.yaml"
  loadGenerator:
    resources:
      - configMap:
          name: "benchmark-resources-uc4-load-generator"
          files:
            - "uc4-load-generator-deployment.yaml"
            - "uc4-load-generator-service.yaml"
  resourceTypes:
    - typeName: "Instances"
      patchers:
        - type: "ReplicaPatcher"
          resource: "uc4-hazelcastjet-deployment.yaml"
    - typeName: PodResources
      patchers:
        - type: ResourceLimitPatcher
          resource: uc4-hazelcastjet-deployment.yaml
          properties:
            container: uc-application
            limitedResource: cpu
            factor: 1000
            format: m
        - type: ResourceLimitPatcher
          resource: uc4-hazelcastjet-deployment.yaml
          properties:
            container: uc-application
            limitedResource: memory
            factor: 4
            format: Gi
  loadTypes:
    - typeName: "NumNestedGroups"
      patchers:
        - type: "EnvVarPatcher"
          resource: "uc4-load-generator-deployment.yaml"
          properties:
            container: "workload-generator"
            variableName: "NUM_NESTED_GROUPS"
        - type: NumNestedGroupsLoadGeneratorReplicaPatcher
          resource: "uc4-load-generator-deployment.yaml"
          properties:
            loadGenMaxRecords: "150000"
            numSensors: "4"
  slis:
    - name: consumerLag
      provider: prometheus
      query: "sum by(consumergroup) (kafka_consumergroup_lag{consumergroup='theodolite-uc4-application'} >= 0)"
    - name: droppedRecords
      provider: prometheus
      query: "sum(rate(com_hazelcast_jet_metrics_lateeventsdropped[30s])) by(job)"
  slos:
    - name: "lag trend"
      sli: consumerLag
      warmupSeconds: 60
      externalSloChecker: "http://localhost:80/evaluate-slope"
      threshold: 2000
    - name: droppedRecords
      sli: droppedRecords
      warmupSeconds: 60
      queryAggregation: max
      repetitionAggregation: median
      operator: lte
      threshold: 100
      externalSloChecker: "http://localhost:8082"
