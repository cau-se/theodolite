apiVersion: theodolite.rocks/v1beta2
kind: benchmark
metadata:
  name: uc4-beam-samza
  labels:
    suite: theodolite-stream-processing
    benchmark: uc4
    sut: beam-samza
spec:
  sut:
    resources:
      - configMap:
          name: "benchmark-resources-uc4-beam-samza"
          files:
          - "input-topic.yaml"
          - "output-topic.yaml"
          - "aggregation-feedback-topic.yaml"
          - "configuration-topic.yaml"
          - "uc4-beam-samza-deployment.yaml"
          - "beam-samza-service.yaml"
          - "service-monitor.yaml"
          - "uc4-jmx-configmap.yaml"
    afterActions:
      - exec:
          selector: # delete zookeeper nodes to reset zookeeper
            pod:
              matchLabels:
                app: "zookeeper-client"
            container: "zookeeper-client"
          command: ["bash", "-c", "bin/zkCli.sh -server $ZOOKEEPER_SERVER deleteall /app-theodolite-uc4-application-1"]
          timeoutSeconds: 60
      - delete:
          selector:
            apiVersion: kafka.strimzi.io/v1beta2
            kind: KafkaTopic
            nameRegex: "^theodolite-.*"
      - delete:
          selector:
            apiVersion: kafka.strimzi.io/v1beta2
            kind: KafkaTopic
            nameRegex: ".*samza.*"
      - delete:
          selector:
            apiVersion: kafka.strimzi.io/v1beta2
            kind: KafkaTopic
            nameRegex: ".*uc4-application.*"
  loadGenerator:
    resources:
      - configMap:
          name: "benchmark-resources-uc4-load-generator"
          files:
          - "uc4-load-generator-deployment.yaml"
          - "uc4-load-generator-service.yaml"
  resourceTypes:
    - typeName: "Instances"
      patchers:
        - type: "ReplicaPatcher"
          resource: "uc4-beam-samza-deployment.yaml"
    - typeName: ThreadsAndPodResources
      patchers:
        - type: EnvVarPatcher
          resource: uc4-beam-samza-deployment.yaml
          properties:
            container: uc4-beam-samza
            variableName: SAMZA_JOB_CONTAINER_THREADS_POOL_SIZE
        - type: ResourceLimitPatcher
          resource: uc4-beam-samza-deployment.yaml
          properties:
            container: uc4-beam-samza
            limitedResource: cpu
            factor: 1000
            format: m
        - type: ResourceLimitPatcher
          resource: uc4-beam-samza-deployment.yaml
          properties:
            container: uc4-beam-samza
            limitedResource: memory
            factor: 4
            format: Gi
  loadTypes:
    - typeName: "NumNestedGroups"
      patchers:
        - type: "EnvVarPatcher"
          resource: "uc4-load-generator-deployment.yaml"
          properties:
            container: "workload-generator"
            variableName: "NUM_NESTED_GROUPS"
        - type: NumNestedGroupsLoadGeneratorReplicaPatcher
          resource: "uc4-load-generator-deployment.yaml"
          properties:
            loadGenMaxRecords: "150000"
            numSensors: "4"
  slis:
    - name: consumerLag
      provider: prometheus
      query: "sum by(consumergroup) (kafka_consumergroup_lag{consumergroup='theodolite-uc4-application'} >= 0)"
  slos:
    - name: "lag trend"
      sli: consumerLag
      warmupSeconds: 60
      externalSloChecker: "http://localhost:80/evaluate-slope"
      threshold: 2000
