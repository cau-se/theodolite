# Theodolite Docs

.docs:
  image: ruby:3.4
  cache:
    paths:
      - docs/vendor
  before_script:
    - cd docs
    - gem install bundler
    - bundle config set --local path 'vendor'
    - bundle install
  rules:
    - changes:
      - docs/**/*
    - when: manual
      allow_failure: true

build-docs:
  stage: build
  extends: .docs
  script: bundle exec jekyll build
  artifacts:
    paths:
      - docs/_site

test-docs-links:
  stage: test
  extends: .docs
  needs:
    - build-docs
  # Ignore external hashes as there seems to be a bug in html-proofer
  # Ignore status code 999 sent from LinkedIn
  # Ignore URLs to the GI Digital Library as they are constantly producing timeouts
  # Replace DOI URLs with API checks (required for ACM DL)
  script: bundle exec htmlproofer --no-check-external-hash --ignore-status-code 999 --ignore_urls "/^https:\/\/dl\.gi\.de\//" --swap-urls "^https\:\/\/doi\.org\/(?\:(?!(api\/))):https\://doi.org/api/handles/" ./_site

build-docs-crds:
  stage: build
  image:
    name: ghcr.io/fybrik/crdoc:0.6.2
    entrypoint: [""]
  script: /crdoc --resources theodolite/crd/ --template docs/api-reference/crds.tmpl --output docs/api-reference/crds.ref.md
  artifacts:
    paths:
      - docs/api-reference/crds.ref.md
    expire_in: 1 week
  rules:
    - changes:
      - docs/api-reference/crds.tmpl
      - theodolite/crd/**/*
    - when: manual
      allow_failure: true

test-docs-crds-regression:
  stage: test
  needs:
    - build-docs-crds
  image: alpine:3.15
  before_script:
    - cd docs
  script:
    - cmp api-reference/crds.md api-reference/crds.ref.md
  artifacts:
    when: on_failure
    paths:
      - docs/api-reference/crds.ref.md
    expire_in: 1 week
